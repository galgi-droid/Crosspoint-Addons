name: Build CrossPoint with my add-ons

# Combines the add-ons listed in addons.txt (each from its own repository, current state)
# with an official CrossPoint release into one firmware per device, and publishes it here.
# Started by hand only for now: Actions tab -> "Build CrossPoint with my add-ons" -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "CrossPoint version to build (empty = latest release)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: addons-build
  cancel-in-progress: false

env:
  UPSTREAM: crosspoint-reader/crosspoint-reader

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      full: ${{ steps.ver.outputs.full }}
    steps:
      - name: Find CrossPoint version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${WANTED:-}" ]; then
            tag="$WANTED"
          else
            tag="$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          # Every build has its own number, shown in Settings and used by "Check for Updates".
          echo "full=${tag#v}-addons.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # one device failing must not block the other
      matrix:
        include:
          - env: x4pro-gh_release
            device: x4pro
          - env: gh_release
            device: x3-x4
    steps:
      - name: Get this repository
        uses: actions/checkout@v6
        with:
          path: addons-repo

      - name: Get the add-ons
        run: |
          set -euo pipefail
          mkdir addons
          : > addons/versions.txt
          grep -v '^[[:space:]]*#' addons-repo/addons.txt | while read -r repo script; do
            [ -n "${repo:-}" ] || continue
            git clone --depth 1 "https://github.com/$repo" "addons/${repo#*/}"
            echo "- $repo @ $(git -C "addons/${repo#*/}" rev-parse --short=7 HEAD)" >> addons/versions.txt
          done
          cat addons/versions.txt

      - name: Get CrossPoint ${{ needs.check.outputs.version }}
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.check.outputs.tag }}
          submodules: recursive
          path: crosspoint

      - name: Add all add-ons
        run: python3 addons-repo/scripts/apply_addons.py crosspoint addons "$GITHUB_REPOSITORY"

      - name: Set the version (${{ needs.check.outputs.full }})
        env:
          VERSION: ${{ needs.check.outputs.version }}
          FULL: ${{ needs.check.outputs.full }}
        run: |
          set -euo pipefail
          test "$(grep -c "^version = ${VERSION}\$" crosspoint/platformio.ini)" = 1 || \
            { echo "ADD-ONS FAILED: version line not found in platformio.ini"; exit 1; }
          sed -i "s/^version = ${VERSION}\$/version = ${FULL}/" crosspoint/platformio.ini

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      # Same tool setup as CrossPoint's own release build.
      - name: Install PlatformIO
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Prepare build tools
        working-directory: crosspoint
        run: |
          set -euo pipefail
          pio pkg install -e "${{ matrix.env }}"
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"

      - name: Build firmware
        working-directory: crosspoint
        run: CROSSPOINT_RC_HASH="$(git rev-parse --short=7 HEAD)" pio run -e "${{ matrix.env }}" -j1

      - name: Name the firmware file
        run: |
          # The on-device updater looks for exactly this file name.
          cp "crosspoint/.pio/build/${{ matrix.env }}/firmware.bin" \
             "crosspoint-${{ needs.check.outputs.full }}-${{ matrix.device }}.bin"

      - uses: actions/upload-artifact@v6
        with:
          name: firmware-${{ matrix.device }}
          path: |
            crosspoint-${{ needs.check.outputs.full }}-${{ matrix.device }}.bin
            addons/versions.txt
          if-no-files-found: error

  publish:
    needs: [check, build]
    # Also publish when only one device built, so its owners still get the update.
    if: always() && needs.check.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          FULL: ${{ needs.check.outputs.full }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/crosspoint-*.bin)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No firmware was built. Nothing to publish."
            exit 1
          fi
          included="$(cat dist/addons/versions.txt 2>/dev/null || echo "- (list not found)")"
          notes="CrossPoint ${VERSION} with my add-ons, build ${FULL}.

          Included:
          ${included}

          - crosspoint-${FULL}-x4pro.bin: Xteink X4 Pro - Cyrillic build, NOT TESTED on a device yet
          - crosspoint-${FULL}-x3-x4.bin: Xteink X3 and X4 (one file for both) - NOT TESTED on a device.
            No touch screen there: everything runs over the buttons, which makes the add-ons harder to use.

          Install: copy the file to the SD card root, then Settings -> SD Card Firmware Update.
          Later updates: Settings -> Check for Updates.

          Official changes in this version: https://github.com/${UPSTREAM}/releases/tag/${TAG}"
          gh release create "$FULL" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "CrossPoint ${VERSION} + add-ons (build ${FULL##*.})" --notes "$notes" --latest
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "At least one device build failed; published what was built."
            exit 1
          fi
